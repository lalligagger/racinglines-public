# The kart-classic demo pack: the first kart world, as it was before the kart pack's tracks took real Mario Kart 8
# Deluxe lap records (`--demo kart-classic`). Same grid, calendar, sprints, live rehearsal and sportsbook book as kart
# (its files and book are kart's); only the tracks differ: made-up F1-length lap times, and Koopa Beach and Luigi
# Raceway where kart has Koopa Cape and Royal Raceway (world.toml). A data pack, nothing else: see
# racinglines/demo/packs/kart/pack.toml.

name = "kart-classic"
title = "Mario Kart Grand Prix (classic)"
tagline = "Let's-a go! 🍄"
sport = "f1"
about = """The first kart demo world: three seasons (2024-2026, twelve rounds each; 2026's rounds 1-9 raced), 20
drivers in 10 teams, made-up F1-length lap times. Every pace, result and price is invented; play money, nothing is
traded anywhere."""

files = "../kart/files"

[generator]
entry = "racinglines.demo.mk_demo.generate:write_pack"
input = "world.toml"

[load]
commands = [
    "racinglines data ingest f1 --years 2024-2026",
    "racinglines model forecast f1 --save --sims 2000",
    "racinglines data pm-links-import f1",
    "racinglines data pm-links-import f1 --exchange kalshi",
]

[book]
file = "../kart/book.toml"
