# Tracks, in calendar order: twelve of Mario Kart 64's sixteen courses. lap_s is the lap the best car runs on a clean
# lap, 5 % slower than the course's single-lap world record (wr_lap_s), so no generated lap beats a record
# (tests/test_demo_store.py). wr_lap_s and wr_race_s are the current Mario Kart 64 world records without shortcuts, on
# NTSC, for one lap and for the three-lap course: mkwrs.com's mk64_wrs.csv, downloaded 2026-10-11 (the generator reads
# only lap_s; the records are kept beside it as the source). Then sector shares, trap speeds (km/h: I1, I2, finish
# line, speed trap), how hard it is to pass (seconds lost per grid place over a race), safety-car and rain chances.
