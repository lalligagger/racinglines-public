# Tracks, in calendar order: twelve Mario Kart 8 Deluxe courses (course = the game's name for it). lap_s is the lap the
# best car runs on a clean lap, 5 % slower than the course's fastest recorded lap (wr_lap_s), so no generated lap beats a
# record (tests/test_demo_store.py). wr_lap_s is the fastest lap split and wr_race_s the fastest three-lap time among
# the 150cc world records in mkwrs.com's mk8dx_wrs.csv (downloaded 2026-10-11), over every category (the generator reads
# only lap_s; the records are kept beside it as the source). Then sector shares, trap speeds (km/h: I1, I2, finish
# line, speed trap), how hard it is to pass (seconds lost per grid place over a race), safety-car and rain chances.
