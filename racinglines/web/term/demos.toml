# The public /term page (racinglines/web/term_routes.py): recorded CLI runs, replayed in the browser. The one place the
# page's commands are written: when the CLI changes, edit `command` and `run` here and re-record with
#   python scripts/demo/record_term.py --run      # LOCAL (Mac): runs each `run` (+ --json), saves `result`, renders
#   python scripts/demo/record_term.py            # anywhere: re-renders the saved results only
# `command` is what the page shows typed at the prompt; `run` is the argv the recorder executes to refresh `result`
# (the JSON the command prints with --json); `render` is the rich_view renderer (map, price or settle); `recorded` is
# when `result` was produced, shown on the page.
#
# The page starts with the CLI's offline --demo (bundled synthetic sample, no database, no hosted server; owner,
# 2026-10-11). Runs that price real races on the hosted server may come later.

[[demo]]
id = "price"
title = "Price a sportsbook's lines against the model and the markets"
command = "racinglines book price --demo"
run = ["racinglines", "book", "price", "--demo"]
result = "price.json"
render = "price"
recorded = "2026-10-11, offline synthetic sample"
caption = "A made-up grid and a made-up book: 16 lines across the F1 kinds we price (win, P2, podium, top 5 and 10, pole, sprint win and pole, fastest lap, head-to-head, biggest mover, red flag, combos). Each line shows the book's price, the model's and the exchanges', side by side, and the EV against each. One line uses a name the book file can't map, to show how that is flagged."

[[demo]]
id = "settle"
title = "Settle the same lines from the results"
command = "racinglines book settle --demo"
run = ["racinglines", "book", "settle", "--demo"]
result = "settle.json"
render = "settle"
recorded = "2026-10-11, offline synthetic sample"
caption = "The same synthetic book, settled from its made-up results: won, lost, void, pending (a parlay leg not raced yet) or left for a manual call, with the payout and profit per line."
