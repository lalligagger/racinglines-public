# The /term demo book: real decimal prices one generic sportsbook showed for the 2026 Singapore Grand Prix (round 17),
# captured 2026-10-06 05:33Z (docs/sportsbook/schemas/books-book_a-2026-10-05-singapore.toml, 13 of its rows), in the
# current book format (docs/sportsbook/slips.md). The parlay's legs carry the two single lines' own prices.
# Re-record the page after changing it: python scripts/demo/record_term.py (docs/webapp.md, Pages: Command line).

[book]
venue = "book_x"
event = "2026-17"
sport = "f1"
captured_utc = "2026-10-06T05:33Z"
source = "screenshot"
odds = "decimal"
currency = "USD"

[[lines]]
id = "ver-win"
title = "Race Winner"
selection = "Verstappen, Max"
odds = 3.50
market = { kind = "race_win", driver = "Max Verstappen" }

[[lines]]
id = "rus-win"
title = "Race Winner"
selection = "Russell, George"
odds = 8.00
market = { kind = "race_win", driver = "George Russell" }

[[lines]]
id = "mcl-top"
title = "Most Team Points"
selection = "McLaren"
odds = 6.50
market = { kind = "race_constructor_top", team = "mclaren" }

[[lines]]
id = "classified-under"
title = "Number Of Classified Drivers"
selection = "Under 18.5"
odds = 1.73
market = { kind = "race_n_classified", line = 18.5, side = "under" }

[[lines]]
id = "classified-over"
title = "Number Of Classified Drivers"
selection = "Over 18.5"
odds = 2.00
market = { kind = "race_n_classified", line = 18.5, side = "over" }

[[lines]]
id = "red-flag-no"
title = "Will There Be A Red Flag During Race?"
selection = "No"
odds = 1.50
market = { kind = "race_red_flag", side = "no" }

[[lines]]
id = "str-classified"
title = "Lance Stroll To Be Classified?"
selection = "Yes"
odds = 2.10
market = { kind = "race_classified", driver = "Lance Stroll", side = "yes" }

[[lines]]
id = "rus-sprint"
title = "Sprint Race Winner"
selection = "Russell, George"
odds = 9.00
market = { kind = "race_sprint_win", driver = "George Russell" }

[[lines]]
id = "pit-stop"
title = "Fastest Team Pit Stop"
selection = "McLaren"
odds = 4.50
market = "unmapped"

[[lines]]
id = "parlay"
title = "Parlay"
selection = "Verstappen win + McLaren most team points"
market = { kind = "combo", legs = [
  { kind = "race_win", driver = "Max Verstappen", odds = 3.50 },
  { kind = "race_constructor_top", team = "mclaren", odds = 6.50 },
] }
