{# The site-wide popup: only the maintenance notice (app.MAINTENANCE_NOTICE, off when ""). The sign-up popup was
   dropped with the landing rebuild (owner, 2026-10-08); the landing page carries the sign-up link instead. #}
{% if maintenance_notice() %}
<dialog id="site-notice" class="site-notice" aria-describedby="site-notice-msg">
  <p id="site-notice-msg">{{ maintenance_notice() }}</p>
  <form method="dialog"><button class="primary" autofocus>OK</button></form>
</dialog>
{% endif %}
