# The bundled demo book: `racinglines book map | price | settle --demo` (no database, network or account). Synthetic, on
# a Mario Kart grid: round 21 is the Rainbow Road Grand Prix, round 22 Bowser's Castle; every odds and price is made up.
# It shows each F1 pricing feature `racinglines book price` has: the model kinds a stored run prices, exchange quotes
# from Kalshi and Polymarket, sides, an h2h listed the other way round, sprint fallbacks, an exchange-only kind, a race
# prop, same-race combos priced jointly and as a flagged product, a cross-race parlay, and an unmapped line. Its results
# (*.json next to it) are what map_book / price_book / settle_book return for it on the synthetic database in
# tests/test_book_demo.py, which checks they match.

[book]
venue = "book_demo"
event = "2026-21"
sport = "f1"
captured_utc = "2026-10-20T09:00Z"
source = "paste"
odds = "decimal"
currency = "USD"

[aliases]
"Super Mario" = "Mario"

[[lines]]
id = "win"
title = "Race Winner"
selection = "Super Mario"
odds = 3.2
market = { kind = "race_win", driver = "Mario" }

[[lines]]
id = "win-no"
title = "Race Winner: No"
selection = "Luigi not to win"
odds = 1.3
market = { kind = "race_win", driver = "Luigi", side = "no" }

[[lines]]
id = "podium"
title = "Podium Finish"
selection = "Peach"
odds = 2.4
market = { kind = "race_podium", driver = "Peach" }

[[lines]]
id = "top5"
title = "Top 5 Finish"
selection = "Toad"
odds = 1.9
market = { kind = "race_top5", driver = "Toad" }

[[lines]]
id = "top10"
title = "Top 10 Finish"
selection = "Bowser"
odds = 1.25
market = { kind = "race_top10", driver = "Bowser" }

[[lines]]
id = "p2"
title = "To Finish 2nd"
selection = "Luigi"
odds = 4.5
market = { kind = "race_p2", driver = "Luigi" }

[[lines]]
id = "pole"
title = "Pole Position"
selection = "Mario"
odds = 2.75
market = { kind = "race_pole", driver = "Mario" }

[[lines]]
id = "fl"
title = "Fastest Lap"
selection = "Luigi"
odds = 5.0
market = { kind = "race_fastest_lap", driver = "Luigi" }

[[lines]]
id = "h2h"
title = "Head to Head"
selection = "Peach v Toad"
odds = 1.8
market = { kind = "race_h2h", driver = "Peach", opponent = "Toad" }

[[lines]]
id = "mover"
title = "Biggest Mover"
selection = "Yoshi"
odds = 6.0
market = { kind = "race_biggest_mover", driver = "Yoshi" }

[[lines]]
id = "spr-win"
title = "Sprint Winner"
selection = "Mario"
odds = 2.9
market = { kind = "race_sprint_win", driver = "Mario" }

[[lines]]
id = "spr-pole"
title = "Sprint Pole"
selection = "Luigi"
odds = 4.0
market = { kind = "race_sprint_pole", driver = "Luigi" }

[[lines]]
id = "red"
title = "Red Flag"
selection = "No"
odds = 1.45
market = { kind = "race_red_flag", side = "no" }

[[lines]]
id = "sgp-joint"
title = "Same Race Combo"
selection = "Mario win + Luigi podium"
odds = 4.2
market = { kind = "combo", legs = [
  { kind = "race_win", driver = "Mario" },
  { kind = "race_podium", driver = "Luigi" },
] }

[[lines]]
id = "sgp-product"
title = "Same Race Combo"
selection = "Peach podium + Toad top 10"
odds = 2.5
market = { kind = "combo", legs = [
  { kind = "race_podium", driver = "Peach" },
  { kind = "race_top10", driver = "Toad" },
] }

[[lines]]
id = "parlay"
title = "Parlay"
selection = "Mario wins Rainbow Road and Bowser's Castle"
market = { kind = "combo", legs = [
  { kind = "race_win", driver = "Mario", odds = 3.2 },
  { kind = "race_win", driver = "Mario", event = "2026-22", odds = 3.0 },
] }

[[lines]]
id = "typo"
title = "Race Winner"
selection = "Maryo"
odds = 3.2
market = { kind = "race_win", driver = "Maryo" }
