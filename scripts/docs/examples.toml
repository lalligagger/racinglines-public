# The docs' captured examples: scripts/docs/capture_examples.py runs each command for real, in this order, and writes
# docs/examples/<id>.md (the command and its exact output). Pages embed one with  --8<-- "examples/<id>.md"
# (or ":command" / ":output" for one half). Never edit docs/examples/ by hand: change this file and re-run.
#
# Everything here runs offline on the kart demo pack (--demo: synthetic data, a separate database), so the order
# matters: the store is built by the first --demo command, the forecast is saved before the book is priced, and the
# live rehearsal runs before its report. Commands that need the network or the hosted server (--remote, data pull,
# remote tools|call|job, check without --offline) are not captured.

[setup]
# Start from a fresh kart store: the first --demo example (db-stats-demo) then shows the build, and run numbers and
# the data change log read the same on every capture. Only the demo store is dropped (racinglines_demo_kart and
# data/demo/kart), never the main database. `--keep-demo` skips this.
fresh_demo = ["kart"]

[defaults]
timeout = 1200
# Rich layout without escape codes; one line per progress step (no redrawing bars); a fixed width so tables wrap the
# same on every machine; no 5-minute heartbeat lines in the output (this script prints its own progress).
# DATABASE_URL is docker-compose.yml's database: the demo store is a second database on the same server.
env = { NO_COLOR = "1", TTY_INTERACTIVE = "0", COLUMNS = "100", RACINGLINES_PROGRESS_SEC = "0", PYTHONUNBUFFERED = "1", DATABASE_URL = "postgresql+psycopg://racinglines:racinglines@localhost:5433/racinglines" }

