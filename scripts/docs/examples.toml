# --- the quickstart on the kart demo pack (docs/quickstart.md) --------------------------------------------------------

[[example]]
id = "db-stats-demo"                       # the first --demo command: builds the store, then prints the stats
command = "racinglines db stats --demo"

[[example]]
id = "model-backtest-kart-demo"
command = "racinglines model backtest kart --demo"

[[example]]
id = "model-forecast-kart-demo"
command = "racinglines model forecast kart --demo --save"

[[example]]
id = "live-run-kart-demo"
command = "racinglines live run kart/demo-2026-09 --demo --simulate --no-fetch"
head = 39                                  # the opening board and the first repricing (after FP1) ...
tail = 28                                  # ... and the results board with the event's closing summary

