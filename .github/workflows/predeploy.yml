name: main-merge-gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  predeploy-staging:
    name: predeploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_PASSWORD: password
      STAGING_URL: https://staging.racinglines.bet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-deploy staging gate
        shell: bash
        run: bash scripts/deploy/predeploy.sh --staging "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Comment on PR when staging gate fails
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: [
                '❌ Pre-deploy staging gate failed.',
                '',
                'This branch cannot merge to main until the `predeploy-staging` check passes.',
                '',
                'Fix the branch, re-run the check, and only then merge.'
              ].join('\n')
            });

  deploy-production:
    name: deploy-production
    needs: predeploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to VM
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VM_NAME: ${{ secrets.VM_NAME }}
          VM_ZONE: ${{ secrets.VM_ZONE }}
        run: bash scripts/deploy/predeploy.sh --prod "${{ github.sha }}"
