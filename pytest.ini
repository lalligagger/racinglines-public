[pytest]
testpaths = tests
pythonpath = .
# -n auto: one worker per core (pytest-xdist), each with its own test database (tests/conftest.py); --dist loadfile
# keeps a file's tests on one worker, in order, with its module fixtures built once. -n 0 runs in one process.
addopts = -q -p no:cacheprovider -n auto --dist loadfile
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
markers =
    quick: synthetic-data checks of every pipeline (no network, no database); python -m pytest -m quick
    live: reads the live database or services (results change as data arrives); deselect with -m "not live"
