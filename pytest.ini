[pytest]
testpaths = tests
pythonpath = .
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
markers =
    quick: synthetic-data checks of every pipeline (no network, no database); python -m pytest -m quick
    live: reads the live database or services (results change as data arrives); deselect with -m "not live"
