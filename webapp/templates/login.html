<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · racinglines admin</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main style="max-width:360px;margin:60px auto">
<h1>racinglines admin</h1>
{% if error %}<p class="bad">Wrong username or password.</p>{% endif %}
<form method="post" action="/login" class="card">
  <input type="hidden" name="next" value="{{ next }}">
  <label style="display:block"><span>Username</span><input name="username" value="admin" autocomplete="username" required style="width:100%"></label>
  <label style="display:block"><span>Password</span><input name="password" type="password" autocomplete="current-password" autofocus required style="width:100%"></label>
  <button class="primary" style="margin-top:8px">Sign in</button>
</form>
<p class="muted">The password is ADMIN_PASSWORD, or the one printed when the app started.</p>
</main></body></html>
