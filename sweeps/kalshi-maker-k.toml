# Kalshi maker profile K (docs/kalshi-history.md, roadmap U3): the maker's settings swept on Kalshi's
# recorded 2025 and 2026 tape (`f1 sweep --venue kalshi`: Kalshi's markets and trades, its maker fee), judged
# on both seasons as params-4h was (2026 the target, 2025 held out). Every job here is a Kalshi job, so the
# automatic baseline is the default maker on Kalshi. The takers in these runs read Polymarket, as always:
# only the maker_* columns are read.
#
#   racinglines f1 search sweeps/kalshi-maker-k.toml
#   racinglines f1 search-report sweeps/kalshi-maker-k.toml

[search]
name = "kalshi-maker-k"
parallel = 3
hours = 6.0
grace_minutes = 15

[report]
target = 2026
holdout = [2025]
top = 30

