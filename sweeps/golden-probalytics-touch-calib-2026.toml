# The golden jobs with the walk-forward calibration power (calib_power = walk_forward, PR #209: each power fitted
# only on races finished before the price), on Probalytics' tape buying at the ask. Owner 2026-10-14: A/B the new calibration on both tapes, the
# same calibration on each. Compare with golden-probalytics-touch-2026:
#   python scripts/probes/probalytics_compare.py --results data/runs/search/golden-probalytics-touch-2026 data/runs/search/golden-probalytics-touch-calib-2026
#
#   TARGET=staging STAGING_DB=racinglines_staging_demo RACINGLINES_TAPE_SOURCE=probalytics MODE=search QUEUE=sweeps/golden-probalytics-touch-calib-2026.toml \
#     scripts/vm/overnight.sh   (a transient unit)
#
# Size: 12 runs. In-sample diagnostic: profile A was tuned on 2026.

[search]
name = "golden-probalytics-touch-calib-2026"
parallel = 2          # 2 vCPU, niced, beside prod's 5-minute recorders and signals
grid = 8
history_cache = true
hours = 3.0
grace_minutes = 20

[report]
target = 2026
holdout = []
top = 10

[[job]]
year = 2026
variant = "gridq+pretrain+reset"
min_edge = 0.1
min_edge_h2h = 0.05
taker_stages = "after FP1,after FP2,after FP3,after SQ,after Sprint,after Quali"
replicates = 3
calib_power = "walk_forward"
taker_fill = "touch"
note = "golden calib touch: profile A at 3 seeds, Polymarket"

[[job]]
year = 2026
venue = "kalshi"
rounds = "5-17"
variant = "gridq+pretrain+reset"
min_edge = 0.1
min_edge_h2h = 0.05
taker_stages = "after FP1,after FP2,after FP3,after SQ,after Sprint,after Quali"
replicates = 3
calib_power = "walk_forward"
taker_fill = "touch"
note = "golden calib touch: profile A at 3 seeds, Kalshi from Canada"
