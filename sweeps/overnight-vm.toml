# Overnight VM run, F1 broad sweep (2026-09-30): docs/overnight-vm-run.md. F1 is the golden baseline: profile A
# first, at 3 seeds, so the VM's numbers can be checked against the published ones (+1,243 / +1,363 at 4k) before
# anything else is read. Then one-at-a-time variations around A (model knobs, then taker knobs), then a small
# model x half-life x edge cross. Polymarket only: Kalshi's taker replay is not usable until its candles carry
# bid/ask (data/runs/search/taker-resweep/REPORT.md section 3). No 24 h volume floor of 0 (untradeable).
# Jobs run in this order and the queue stops starting jobs after `hours`, so a slow night cuts the cross first.
# scripts/vm/promote_16k.py appends the 16k confirmation block at the end after `f1 search-report`.
#
# Size: 48 settings x 2 seasons + A's 2 extra seeds x 2 + 6 baselines = 106 jobs at 4,000 sims.
#
#   racinglines f1 search sweeps/overnight-vm.toml
#   racinglines f1 search-report sweeps/overnight-vm.toml
#   python scripts/vm/promote_16k.py sweeps/overnight-vm.toml --top 10
#   racinglines f1 search sweeps/overnight-vm.toml        (again: runs only the 16k block)
#   racinglines f1 search-report sweeps/overnight-vm.toml

[search]
name = "overnight-vm"
parallel = 2          # the VM runs as n2-standard-2 tonight (2 vCPU, 8 GB); runs are niced, so the web app, MCP and Postgres still get CPU
grid = 8
history_cache = true
hours = 3.0
grace_minutes = 20

[report]
target = 2026
holdout = [2025]
top = 40


# --- golden ---

[[job]]
year = 2026
variant = "gridq+pretrain+reset"
min_edge = 0.1
min_edge_h2h = 0.05
taker_stages = "after FP1,after FP2,after FP3,after SQ,after Sprint,after Quali"
replicates = 3
note = "golden: profile A at 3 seeds (the default settings get 3 too)"

[[job]]
year = 2025
variant = "gridq+pretrain+reset"
min_edge = 0.1
min_edge_h2h = 0.05
taker_stages = "after FP1,after FP2,after FP3,after SQ,after Sprint,after Quali"
replicates = 3
note = "golden: profile A at 3 seeds (the default settings get 3 too)"


