# The golden Kalshi job on our own tape with max_spread = 0.10 (owner, 2026-10-14), the our-tape side of
# sweeps/golden-probalytics-spread-2026.toml: a stage whose quote is wider than 10 cents is not tradeable. Kalshi only:
# our Polymarket tape has no quote, so max_spread does nothing there. Run with RACINGLINES_TAPE_SOURCE unset.
# Compare: python scripts/probes/probalytics_compare.py --results data/runs/search/golden-ours-spread-2026 \
#            data/runs/search/golden-probalytics-spread-2026
#
#   TARGET=staging STAGING_DB=racinglines_staging_demo MODE=search QUEUE=sweeps/golden-ours-spread-2026.toml \
#     scripts/vm/overnight.sh   (a transient unit)
#
# Size: 1 job x 3 seeds, plus the baseline at 3 seeds = 6 runs.

[search]
name = "golden-ours-spread-2026"
parallel = 2          # 2 vCPU, niced, beside prod's 5-minute recorders and signals
grid = 8
history_cache = true
hours = 3.0
grace_minutes = 20

[report]
target = 2026
holdout = []
top = 10

[[job]]
year = 2026
venue = "kalshi"
rounds = "5-17"
variant = "gridq+pretrain+reset"
min_edge = 0.1
min_edge_h2h = 0.05
taker_stages = "after FP1,after FP2,after FP3,after SQ,after Sprint,after Quali"
replicates = 3
max_spread = 0.10
note = "golden spread: profile A at 3 seeds, Kalshi from Canada"
