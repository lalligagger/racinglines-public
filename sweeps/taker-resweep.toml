# Taker re-sweep (2026-09-30, owner's ask in the "Taker sweeps and top 10" project thread): the five weekend
# taker strategies (update, hold, last, early, stage-aware) swept on F1 over both venues' recorded tapes,
# Polymarket and Kalshi, 2026 the target and 2025 held out. Round 1 is written here; rounds 2 and 3 are
# added by the steering agent around the round-1 leaders (each with a note), then the top settings are
# confirmed at 16,000 simulations. Plan: project files taker-resweep/PLAN.md.
#
#   racinglines f1 search sweeps/taker-resweep.toml
#   racinglines f1 search-report sweeps/taker-resweep.toml

[search]
name = "taker-resweep"
parallel = 4
grid = 8
history_cache = true
hours = 6.0
grace_minutes = 15

[report]
target = 2026
holdout = [2025]
top = 40

# --- round 0: incumbent profile A on both venues ------------------------------------------------

[[job]]
year = 2026
venue = "polymarket"
variant = "gridq+pretrain+reset"
min_edge = 0.1
min_edge_h2h = 0.05
taker_stages = "after FP1,after FP2,after FP3,after SQ,after Sprint,after Quali"
note = "r0 profile A polymarket"

[[job]]
year = 2025
venue = "polymarket"
variant = "gridq+pretrain+reset"
min_edge = 0.1
min_edge_h2h = 0.05
taker_stages = "after FP1,after FP2,after FP3,after SQ,after Sprint,after Quali"
note = "r0 profile A polymarket"

[[job]]
year = 2026
venue = "kalshi"
variant = "gridq+pretrain+reset"
min_edge = 0.1
min_edge_h2h = 0.05
taker_stages = "after FP1,after FP2,after FP3,after SQ,after Sprint,after Quali"
note = "r0 profile A kalshi"

[[job]]
year = 2025
venue = "kalshi"
variant = "gridq+pretrain+reset"
min_edge = 0.1
min_edge_h2h = 0.05
taker_stages = "after FP1,after FP2,after FP3,after SQ,after Sprint,after Quali"
note = "r0 profile A kalshi"

