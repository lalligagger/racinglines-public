# Strategy review (2026-10-05, owner's ask in the "Kalshi bid/ask" project thread): every F1 strategy identified so
# far, on Polymarket and on Kalshi at the touch, both seasons, at 16,000 simulations; plus rolling Kelly sizing on a
# $10,000 bankroll and the every-kind variant (adds Kalshi's top 10). One job per distinct settings set: a job runs
# all four takers and five makers, so T8 / T9 are the `early` rows of the T1 / T7 jobs, M1 the baseline's maker row,
# and TB (half T1, half T8) is read off those two. Plan: project files strategy-review/2026-10-05-all-strategies-plan.md.
# Writes only analysis records: stage runs (each priced once and reused) and one saved sweep run per job, which the
# report reads. No data fetch. Back up first (see the handoff).
#
#   racinglines f1 search sweeps/strategy-review.toml
#   racinglines f1 search-report sweeps/strategy-review.toml

[search]
name = "strategy-review"
parallel = 4
grid = 8
history_cache = true
hours = 14.0
grace_minutes = 30

[report]
target = 2026
holdout = [2025]
rank_sims = 16000
confirm_sims = 16000
top = 80

