# Default strategies refresh, F1 Polymarket taker library (owner GO 2026-10-11 22:52Z, plan:
# library/core/2026-10-11-overnight-default-strategies-plan.md). Phase 1 is a copy of sweeps/overnight-vm.toml's jobs
# (A at 3 seeds, one-at-a-time around A, the cross; 106 jobs at 4k); phase 3 re-baselines the shortlist's own settings
# (profiles.py TAKER_PROFILES T2-T7, T10; T1 = A) at 16k; phase 4 is the noise floor (T1 and T7 at seeds 1 and 2) at
# 16k. scripts/vm/promote_16k.py appends phase 2 (top 10 at 16k, plus A and the baseline) after the first report.
# Promotion: both seasons beat the incumbent by more than the noise floor (docs/f1-roadmap.md section 5), one
# decision-log row per promoted setting. 2026 primary (17 weekends), 2025 held out.
#
#   TARGET=staging MODE=f1 QUEUE=sweeps/defaults-2026-10.toml scripts/vm/overnight.sh   (a transient unit; see the plan)
#
# Size: 106 (phase 1) + <= 24 (phase 2) + 14 (phase 3) + 8 (phase 4) <= 152 jobs.

[search]
name = "defaults-2026-10"
parallel = 2          # 2 vCPU, niced, as on 2026-09-30 beside prod's 5-minute recorders and signals
grid = 8
history_cache = true
hours = 5.0
grace_minutes = 20

[report]
target = 2026
holdout = [2025]
top = 40


# --- golden ---

[[job]]
year = 2026
variant = "gridq+pretrain+reset"
min_edge = 0.1
min_edge_h2h = 0.05
taker_stages = "after FP1,after FP2,after FP3,after SQ,after Sprint,after Quali"
replicates = 3
note = "golden: profile A at 3 seeds (the default settings get 3 too)"

[[job]]
year = 2025
variant = "gridq+pretrain+reset"
min_edge = 0.1
min_edge_h2h = 0.05
taker_stages = "after FP1,after FP2,after FP3,after SQ,after Sprint,after Quali"
replicates = 3
note = "golden: profile A at 3 seeds (the default settings get 3 too)"


