global
    log stdout local0
    maxconn 4096
    daemon
    tune.ssl.default-dh-param 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5000
    timeout client 50000
    timeout server 50000
    option forwardfor
    option http-server-close
    http-reuse safe

# Production app backend (primary for racinglines.bet)
backend prod_backend
    balance roundrobin
    server prod_main 127.0.0.1:8000 check inter 2000 rise 2 fall 3

# Staging app backend (primary for staging.racinglines.bet)
backend staging_backend
    balance roundrobin
    server staging_main 127.0.0.1:8010 check inter 2000 rise 2 fall 3

# Failover backend: prod only (fallback if staging is down)
backend failover_backend
    balance roundrobin
    server prod_fallback 127.0.0.1:8000 check inter 2000 rise 2 fall 3

# Frontend for HTTP (redirect to HTTPS in production, but accept locally for health checks)
frontend http_frontend
    bind 127.0.0.1:8080
    bind [::1]:8080
    mode http

    # Log production requests
    acl is_prod_host hdr(host) -i racinglines.bet localhost:8080
    acl is_staging_host hdr(host) -i staging.racinglines.bet

    # Route to production backend (primary)
    use_backend prod_backend if is_prod_host

    # Route to staging backend with failover to prod
    # If staging is healthy, use it; otherwise fall back to prod
    use_backend staging_backend if is_staging_host
    use_backend failover_backend if is_staging_host !{ req.hdr_cnt(staging_backend) gt 0 }

    # Default to prod
    default_backend prod_backend

# Frontend for HTTPS (if needed; currently external LB handles TLS)
# This is a placeholder for future local TLS termination
frontend https_frontend
    bind 127.0.0.1:8443 ssl crt /etc/racinglines/certs/combined.pem
    mode http
    option httplog

    acl is_prod_host hdr(host) -i racinglines.bet
    acl is_staging_host hdr(host) -i staging.racinglines.bet

    use_backend prod_backend if is_prod_host
    use_backend staging_backend if is_staging_host
    default_backend prod_backend

# Stats page (internal only, useful for monitoring)
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
