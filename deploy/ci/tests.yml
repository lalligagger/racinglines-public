name: tests

# The regression suite on every PR into main or staging and every push to either (the README's "tests" badge).
# Postgres runs as a service; TEST_DATABASE_URL names racinglines_test, which the test fixture drops and rebuilds.
# The pinned fixtures aren't in the public repo (docs/contributing.md), so fixture-based tests skip here.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (not live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: racinglines
          POSTGRES_PASSWORD: racinglines
          POSTGRES_DB: racinglines
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U racinglines"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://racinglines:racinglines@localhost:5433/racinglines_test
      DATABASE_URL: postgresql+psycopg://racinglines:racinglines@localhost:5433/racinglines_test
      RACINGLINES_PROGRESS_SEC: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Regression suite
        run: python -m pytest -m "not live" -q -ra
