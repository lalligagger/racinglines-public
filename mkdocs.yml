site_name: racinglines
site_description: Data pipelines, race simulators and market-making tools for timed racing (UCI downhill, Formula 1)
docs_dir: docs
site_dir: site
exclude_docs: |
  examples/
# docs/examples/ holds captured command output (scripts/docs/capture_examples.py) that pages embed with
# --8<-- "examples/<id>.md"; the files are never pages of their own
theme:
  name: material
  features:
    - navigation.tabs        # top-level sections as tabs across the header
    - navigation.sections    # second level shown as groups in the sidebar
    - navigation.top         # "back to top" button
    - navigation.footer      # previous / next page links
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy      # copy button on every code block
    - content.code.annotate
    - content.tabs.link      # picking a tab ("Command" / "Output", "LOCAL" / "VM") picks it on every page
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font: false                # system fonts: no request to Google Fonts from behind the login
  icon:
    repo: fontawesome/brands/github
repo_url: https://github.com/lalligagger/racinglines-public
edit_uri: ""
extra_css:
  - css/wide.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:          # :material-console: icons on the landing and "Next steps" cards
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:       # --8<-- "examples/<id>.md" embeds a captured command + output (scripts/docs/capture_examples.py)
      base_path: [docs]
      check_paths: true
hooks:
  - scripts/docs/llms_txt.py   # site/llms.txt, site/llms-full.txt and each page's .md source (llmstxt.org)
extra:
  llms:
    title: racinglines
    summary: >-
      racinglines turns official race timing into win, podium, head-to-head and championship odds for race-sport
      prediction markets (Formula 1 on Polymarket and Kalshi, UCI downhill mountain biking, NASCAR Cup and MotoGP),
      priced strictly as of any moment and tested on real market tapes. These docs cover the data pipelines, the
      pricing models and their evaluation, market making and paper trading, the sportsbook slip schema, the web app
      and MCP server, the CLI (with a synthetic kart demo pack that runs offline), and how the production VM is run.
    site_url: https://racinglines.bet/docs/
    source_url: https://github.com/lalligagger/racinglines-public/blob/main/docs/
    full_url: https://racinglines.bet/llms-full.txt
    top_section: Overview
    exclude: [internal/]       # the admin-only book never goes in; pages outside the nav never do either
nav:
  - Get started:
      - Overview: index.md
      - Quickstart: quickstart.md
      - Demo data packs: demo.md
      - Contributing: contributing.md
  - Use the app:
      - Web app: webapp.md
      - Alpha layout: alpha-layout.md
      - Fantasy league:
          - Fantasy soft launch (index): fantasy-launch.md
          - Fantasy accounts: fantasy-accounts.md
          - Fantasy trading: fantasy-trading.md
  - CLI:
      - CLI reference: cli.md
      - Sportsbook schema (draft):
          - Schema, CLI and MCP surface: sportsbook/index.md
          - Slip EV (book map, price, settle): sportsbook/slips.md
          - Bet-slip graphics (book render): sportsbook/render.md
          - Market vocabulary: sportsbook/vocabulary.md
  - MCP:
      - MCP server: mcp.md
  - Sports & data:
      - Sports and exchanges (status): coverage.md
      - Adding a sport: add-a-sport.md
      - Sources & layout: data.md
      - Parser: parser.md
      - Database: database.md
      - Data changes:
          - Data change log: data-changes.md
          - Kalshi bid/ask re-pull (2026-10-05): data-changes/2026-10-05-kalshi-bid-ask-repull.md
      - Weather forecasts: weather.md
      - Exchanges as schemas (OG.com): exchanges.md
      - Kalshi history: kalshi-history.md
      - Road cycling (book lines): road-cycling.md
  - Models:
      - Formula 1:
          - F1 model: f1.md
          - F1 evaluation: f1-evaluation.md
          - F1 forecast: f1-forecast.md
          - F1 calibration: f1-calibration.md
          - Market making: market-making.md
          - Paper trading: paper-trading.md
          - Championship markets: championship-markets.md
      - Downhill:
          - Downhill model: model.md
          - Downhill evaluation: evaluation.md
          - Downhill forecast: forecast.md
      - Engine:
          - Backtest core (all sports): backtest-core.md
          - Parity rebuild (all combos): parity-rebuild.md
          - Input frames (engine E1): frames.md
  - Operate:
      - VM deploy: vm-deploy.md
      - Market tape (record and backfill): market-tape.md
      - Race weekend runbook: weekend-data-runbook.md
      - Live events: live-events.md
      - Overnight VM run: overnight-vm-run.md
      - Cloud sweeps: cloud-sweep.md
      - Testing: testing.md
      - Email setup: email-setup.md
      - Plans:
          - Cloud build-out: cloud-buildout.md
          - Google Cloud proposal: google-cloud.md
          - Data off GitHub (plan): data-off-github.md
      - Historical:
          - VM reliability (pre-launch): vm-reliability.md
          - Fantasy launch runbook: fantasy-runbook.md
  - Roadmap:
      - Priorities and open items: todo.md
      - Strategy 2026 (demo plan): strategy-2026.md
      - F1 live test (round 16): f1-live-roadmap.md
      - F1 roadmap: f1-roadmap.md
      - Engine roadmap (all sports): engine-roadmap.md
  - Background:
      - Project history: history.md
      - F1 reference: f1-reference.md
      - PyPI page (example): pypi-example.md
      - Reports and notes:
          - Strategy review (2026-10-06): strategy-review.md
          - Strategy opening preview: strategy-preview.md
          - Novig and a model bake-off: novig-and-model-bakeoff.md
          - Launch sprint (Oct 2026): launch-sprint.md
