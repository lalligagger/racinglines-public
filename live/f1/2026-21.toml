# Launch spec: Las Vegas Grand Prix (private book) (racinglines live, docs/live-events.md). Written by `racinglines live new f1 2026-21`;
# edit freely before the book opens (the settings freeze into meta.json at the first update).
sport = "f1"
event = "2026-21"
title = "Las Vegas Grand Prix (private book)"

# The window (UTC, from the FastF1 schedule): the book opens 2026-11-19T23:30:00, closes at lights out 2026-11-22T04:00:00,
# and settles from the results (2026-11-22T07:00:00).
# Saturday-night race: lights out is Sat 21 Nov 20:00 PST (UTC-8; US DST ended 1 Nov). Every stage cut-off is before it:
# after FP1 Thu 18:00, after FP2 Thu 21:30, after FP3 Fri 18:00, after Quali Fri 21:30 (all PST); results expected ~23:00 Sat.
[window]
open = "2026-11-19T23:30:00"
close = "2026-11-22T04:00:00"
results = "2026-11-22T07:00:00"

# Overrides of sports/f1.toml [live], e.g. [live.quoting] max_pos = 1000.0
[live.markets]
h2h_from = "last_listed"        # head-to-head pairs: the last race Polymarket listed (resolved at the opening)

# The demo taker's hype picks, placed at the opening at the maker's ask ($25 each): names and stories, not value.
