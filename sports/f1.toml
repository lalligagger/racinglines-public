# Formula 1: what differs from other sports, as data. Read by racinglines/sports.py;
# the code keeps its own constant names (e.g. model.SESSION_MINUTES) and takes the
# values from here. Changing a value here changes results: re-run the tests.

[sport]
code = "f1"
name = "Formula 1"
result_kind = "position"          # results are finishing positions
model_family = "position_sim"     # racinglines/models/position_sim
pricing_model = "racinglines.models.race_model:PositionSim"   # the backtest core's wrapper (docs/backtest-core.md)
display_order = 0

[league]
code = "fia_f1"
name = "FIA Formula One World Championship"
organizer = "FIA / Formula One Group"

[competition]
code = "f1_wdc"
name = "Formula 1 World Championship (Drivers)"
categories = { DRV = ["Drivers", "X", "elite"] }

[model]
# Data hooks for the sport-agnostic results model (racinglines/models/model_global.py, `racinglines backtest
# walk-forward f1 --model global`): the F1 pricing model above reads laps and sectors; this one reads finishing
# positions only. No setting here is tuned.
source = "f1timing"               # the events whose race results are the history
group = "team"                    # results.team: the constructor, for the optional team-form prior

[data]
# the L1 input frames this sport's adapter (racinglines/frames/f1.py) builds from Measurements, docs/frames.md.
# "laps" isn't listed: Measurements keeps measures derived from the laps, not the laps themselves
frames = ["entrants", "sessions", "classifications", "conditions", "venue_features", "official_results"]
# frames whose source dates each row as it happens. None for F1: FastF1's archive publishes a session's results and
# laps only once the session has ended, so every row of a session is available at that session's end
live = []

[sessions]
# minutes each session runs; its data is usable once it has ended
minutes = { fp1 = 60, fp2 = 60, fp3 = 60, sprint_qual = 45, qual = 60, sprint = 45, race = 150 }
practice = ["fp1", "fp2", "fp3", "sprint_qual"]

# FastF1 schedule names -> (minutes, short label), for trading stages through a weekend
[sessions.schedule]
"Practice 1" = [60, "FP1"]
"Practice 2" = [60, "FP2"]
"Practice 3" = [60, "FP3"]
"Sprint Qualifying" = [45, "SQ"]
"Sprint Shootout" = [45, "SQ"]
"Sprint" = [45, "Sprint"]
"Qualifying" = [60, "Quali"]

# When a race weekend is priced and traded (racinglines/core/stages.py): the stages come from the session
# schedule above; the race itself is never traded
[stages]
pre_label = "pre-weekend"
pre_minutes = 60                         # "before any running": 1 h before the first session
lag_minutes = 30                         # a session's data is used 30 min after it ends
until = "Race"

[stages.closes]                          # a market kind closes when this session starts (a list: either name)
race_pole = "Qualifying"                 # pole markets close when qualifying starts
race_sprint_pole = ["Sprint Qualifying", "Sprint Shootout"]   # sprint pole when sprint qualifying starts ...
race_sprint_win = "Sprint"               # ... and the sprint winner at the sprint's start (Kalshi's sprint markets, U5)

[points]
race = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1]
sprint = [8, 7, 6, 5, 4, 3, 2, 1]
sprint_by_year = { 2021 = [3, 2, 1] }

[tracks]
# circuits (FastF1 "Location" slug) on public roads: slower, walls, fewer overtakes
street = ["monte-carlo", "monaco", "baku", "marina-bay", "singapore", "jeddah", "las-vegas", "miami",
          "miami-gardens", "melbourne", "montreal", "madrid"]

[regulations]
# seasons that start under new technical regulations (new cars): earlier seasons' car pace
# carries over less (position_sim REG_RESET switch)
resets = [2014, 2017, 2022, 2026]

[markets]
venues = ["polymarket", "kalshi", "private"]
standard_kinds = ["race_win", "race_podium", "race_top10"]           # the board's columns
weekend_kinds = ["race_win", "race_podium", "race_h2h", "race_constructor_top", "race_pole"]   # traded in the sweep

[live]
# A race weekend's private book (pipelines/live_f1.py): updated at session ends from the model's stage runs,
# not from a live feed. docs/f1-live-roadmap.md, scenario B.
adapter = "racinglines.pipelines.live_f1"
stream = "the model's stage runs, one per session (FastF1 archive)"

[live.sources]
historical = { kind = "fastf1" }
live = { kind = "stage_runs", profile = "C" }     # the demo maker's profile (pipelines/profiles.py)

[live.poll]
mode = "session_end"
lag_min = 30                    # a session's data is used 30 min after it ends (weekend_sweep.DATA_LAG)
step_min = 5                    # the LaunchAgent runs one step every 5 minutes
late_alert_h = 2                # alert when an update is more than 2 hours late
stale_h = 30                    # the Live tab stays green between updates while the next one isn't this overdue

[live.markets]
kinds = ["race_win", "race_podium", "race_pole", "race_h2h", "race_constructor_top"]
# opt-in props (models/position_sim/props.py): "race_safety_car", "race_red_flag", "race_rain", "race_fastest_lap";
# add them here or in a launch spec. [live.props] prior_n (default 16) sets the per-circuit shrinkage
h2h_from = "last_listed"        # head-to-head pairs: the last race Polymarket listed (or an event key)

[live.quoting]
# tighter as the model sees more of the weekend; requoted from the latest fair at every update (never frozen),
# closed at lights out
half_spread = { "pre-weekend" = 0.03, "after FP1" = 0.025, "after FP2" = 0.025, "after SQ" = 0.025, "after Sprint" = 0.02, "after FP3" = 0.02, "after Quali" = 0.02 }
max_pos = 2500.0
skew = 1.0

[live.crowd]
# the same crowd as downhill, trading in one batch per update: the window since the last update, at a
# steady per-hour rate, against the quotes posted at its start
takers = 1000
budget = [10.0, 200.0]
bet = [0.2, 0.8]
min_bet = 2.0
seed = 20261002
rate_h = 0.0006                 # per taker, per quoted market, per hour
late_cap = 100.0                # the pre-race window (after qualifying to lights out): fresh $100 caps ...
late_pace = 3.0                 # ... at 3x the rate

[live.picks]
stake = 25.0                    # the demo taker's hype picks, placed at the book's opening
