# NASCAR Cup Series: a tape-only sport (docs/todo.md, U9). No model, no pipeline: its Kalshi, Polymarket and OG.com markets are synced
# and recorded (links unmodeled but identified: driver, race, contract; prices / trades / books archived per exchange) when asked for by name
# (`racinglines markets [--exchange kalshi] --sport nascar ...`). Read by racinglines/sports.py; the syncs read
# [markets.kalshi] and [markets.polymarket]. Nothing runs for this sport by default.

[sport]
code = "nascar"
name = "NASCAR Cup Series"
result_kind = "position"          # finishing positions, once there is a model
model_family = "none"             # tapes only: no model, no pricing_model, no live adapter
display_order = 2

[league]
code = "nascar"
name = "NASCAR Cup Series"
organizer = "NASCAR"

[competition]
code = "nascar_cup"
name = "NASCAR Cup Series (Drivers)"
display_name = "NASCAR"
categories = { DRV = ["Drivers", "X", "elite"] }

[markets]
venues = ["polymarket", "kalshi"]
standard_kinds = []               # nothing is priced, so the board has no columns for it

[markets.kalshi]
# Kalshi series tickers to sync, by prefix: every Sports series whose ticker starts with one of these
# (`sync --series TICKER ...` overrides the list). Off by default: only `--sport nascar` syncs them.
series = ["KXNASCAR"]

[markets.polymarket]
# Gamma /events tag_slug values to page (`sync --tags SLUG ...` overrides the list). Off by default: only `--sport nascar` syncs them.
# UNVERIFIED against the live Gamma API (cloud session can't reach Polymarket); confirmed listed 2026-09-29 by the
# owner's public-search probe (docs/coverage.md); `sync --tags SLUG ...` overrides.
tags = ["nascar"]

[identity]
# Which driver, race and contract a market is about, whichever exchange listed it (racinglines/sources/nascar/links.py).
# The syncs fill athlete_id, race_id and params (kind, nascar_series, season) on every link of this sport; `prediction`
# stays unmodeled. `racinglines nascar link` does the same for links already in the database.
resolver = "nascar"
