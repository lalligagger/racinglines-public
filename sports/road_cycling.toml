# UCI road cycling: a tape-only sport (docs/todo.md, U9). No model, no pipeline: its Kalshi markets are synced and
# recorded (links unmodeled, prices / trades / books archived per exchange) when asked for by name
# (`racinglines markets --exchange kalshi --sport road_cycling ...`). Read by racinglines/sports.py; the sync reads
# [markets.kalshi]. Nothing runs for this sport by default.

[sport]
code = "road_cycling"
name = "UCI road cycling"
result_kind = "position"          # finishing positions, once there is a model
model_family = "none"             # tapes only: no model, no pricing_model, no live adapter
display_order = 6

[league]
code = "uci_road"
name = "UCI World Tour"
organizer = "UCI"

[competition]
code = "uci_road_wt"
name = "UCI World Tour (Riders)"
display_name = "Road cycling"
categories = { RDR = ["Riders", "X", "elite"] }

[markets]
venues = ["kalshi", "polymarket"]
standard_kinds = []               # nothing is priced, so the board has no columns for it

[markets.kalshi]
# Kalshi series tickers to sync, by prefix: every Sports series whose ticker starts with one of these
# (`sync --series TICKER ...` overrides the list). Off by default: only `--sport road_cycling` syncs them.
# These cover the Tour de France, Giro and Vuelta (grand-tour winner, stage, team and jersey markets). KXCYCLING
# already matches the other three by prefix (series_for uses startswith); they are listed for the reader.
# The sync's `--closed` flag pulls the settled 2026 history Kalshi still serves.
series = ["KXCYCLING", "KXCYCLINGSTAGE", "KXCYCLINGTEAM", "KXCYCLINGJERSEY"]

[markets.polymarket]
# Polymarket Gamma tag slug for cycling markets.
tags = ["cycling"]

[identity]
# Which cyclist, race and contract a market is about, whichever exchange listed it (racinglines/sources/cycling/links.py).
# The syncs fill athlete_id, race_id and params (kind, season) on every link of this sport; `prediction`
# stays unmodeled.
resolver = "cycling"

[results]
# Results source: Wikipedia (CC-BY-SA 3.0, approved 2026-10-01). Future primary: First Cycling API (terms under review).
# Races are recorded as tape-only (unmodeled); a model is 2027 roadmap (docs/coverage.md line 126).
# Wikipedia coverage: Grand Tours (Tour de France, Giro d'Italia, Vuelta a España), Monuments (Milan–San Remo,
# Tour of Flanders, Paris–Roubaix, Liège–Bastogne–Liège, Giro di Lombardia) and other UCI World Tour races back
# decades. Tables (GC, stages, KOMs, jerseys) are structured but require HTML parsing; schema registration will
# enable the results pipeline when the adapter is built (racinglines/sources/cycling/).
fallback_rule = "wikipedia_only"

[[results.fallbacks]]
source = "wikipedia"
quality = "full_results"
scope = "grand_tour_classics"
allow = true
notes = "CC-BY-SA 3.0 content; no automated scraping restrictions in ToS; must attribute"

# Future: when First Cycling access is cleared, add as primary source above fallbacks.
