# UCI road cycling. A schema-driven sport on the one engine (racinglines/models/model_global.py, its results core
# models/inputs/results.py): ProCyclingStats results (racinglines/sources/pcs.py, fetched on the owner's Mac) are loaded
# into events / races / results (racinglines/sources/pcs_ingest.py, `racinglines data ingest cycling`), an upcoming race
# and its start list are scheduled (`racinglines data schedule cycling <event>`), and `racinglines model forecast
# cycling --save` stores the forecast run the Markets board reads (docs/road-cycling.md). Its Kalshi markets are synced and
# recorded when asked for by name (`racinglines markets --exchange kalshi --sport road_cycling ...`).
# The sportsbook tool (racinglines/models/cycling.py, `racinglines model price cycling ...`, [model.itt] / [model.road]
# below, sports/road_cycling/events/) stays as it was: a separate book-pricing tool, not the board's model, and not a
# [sport] challengers entry (it has no race_model contract: load / history / price). Read by racinglines/sports.py.

[sport]
code = "road_cycling"
name = "UCI road cycling"
result_kind = "position"          # finishing positions
model_family = "global"           # the one engine at the results level, [model] below
# Provisional, a priori, nothing tuned: docs/f1-roadmap.md decision log 2026-10-12 "Road cycling on the one engine"
pricing_model = "racinglines.models.model_global:GlobalModel"
calibration = "baseline"          # pages label its prices as baseline: settings untuned (decision log 2026-10-12)
display_order = 6
# Who the web app shows road cycling to: admins only. ProCyclingStats' terms were reviewed by the owner for personal,
# non-commercial use (2026-10-05, [results] below); admin-only until the owner's data-terms review clears it. Still
# ingested, priced and recorded; "all" shows it again.
audience = "admin"
results_modules = ["racinglines.sources.pcs"]   # what fetches its results (`backtest coverage`)

[league]
code = "uci_road"
name = "UCI World Tour"
organizer = "UCI"

[competition]
code = "uci_road_wt"
name = "UCI World Tour (Riders)"
display_name = "Road cycling"
categories = { RDR = ["Riders", "X", "elite"] }

[markets]
venues = ["kalshi"]
# The board's columns: per-rider fairs from the forecast run (race_predictions win / podium / top 10)
standard_kinds = ["race_win", "race_podium", "race_top10"]
# The kinds the model prices for a link ([forecast] h2h stores the head-to-heads). No resolver files Kalshi's cycling
# links yet ([identity]), so they stay unmodeled until one does
kinds = ["race_win", "race_podium", "race_top5", "race_top10", "race_top20", "race_h2h"]

[markets.kalshi]
# Kalshi series tickers to sync, by prefix: every Sports series whose ticker starts with one of these
# (`sync --series TICKER ...` overrides the list). Off by default: only `--sport road_cycling` syncs them.
# These cover the Tour de France, Giro and Vuelta (grand-tour winner, stage, team and jersey markets). KXCYCLING
# already matches the other three by prefix (series_for uses startswith); they are listed for the reader.
# The sync's `--closed` flag pulls the settled 2026 history Kalshi still serves.
series = ["KXCYCLING", "KXCYCLINGSTAGE", "KXCYCLINGTEAM", "KXCYCLINGJERSEY"]

# --- the one engine ---------------------------------------------------------------------------------------------------

[model]
# The engine's inputs and data hooks (racinglines/models/inputs/__init__.py; results core: models/inputs/results.py).
# Finishing positions only: PCS gives a classification per race, fields of 100-180 riders that change from race to race.
inputs = ["results"]
source = "pcs_road"               # events.source of the history: one-day races and stage-race final GCs (the "road"
                                  # results file); ITTs are stored as "pcs_itt" and left out of it
group = "team"                    # results.team, for the optional team-form prior (group_weight, 0 = off). The PCS
                                  # results files carry no team, only start lists do: inert until results have one

[model.defaults]
# Every value a priori, none tuned (decision log 2026-10-12 "Road cycling on the one engine"); the engine's own
# defaults are sims 2000, half-life 240 d, prior weight 3, noise 0.8, uncertainty 0.5
sims = 4000                       # a priori: 100-180 riders, so the long shots' win chances need more draws
half_life_days = 365.0            # a priori: riders race 40-70 days a year, fewer per kind of race (the book model's
                                  # road guess, [model.road.defaults] half_life)
prior_weight = 3.0                # a priori: the engine's default
noise = 1.0                       # a priori: wider than the motor sports' 0.8 (bunch finishes, crashes, team orders),
                                  # so favourites are not over-confident before any calibration
uncertainty = 0.5                 # a priori: the engine's default
dnf = true                        # a priori: retirements drawn from each rider's shrunk DNF rate (the engine's default)

[forecast]
# The sport forecast (racinglines/pipelines/sport_forecast.py, `racinglines model forecast cycling`)
field = "entry_list"              # price only a race with its own start list (`data schedule cycling`), never the last
                                  # race's riders
h2h = true                        # store every pair's head-to-head (race_predictions.extra.h2h)

# --- the book model (racinglines/models/cycling.py, docs/road-cycling.md) -------------------------------------------

[results]
# ProCyclingStats, fetched on the owner's Mac only (`racinglines data fetch cycling`, racinglines/sources/pcs.py): the
# cloud sandbox can't reach it. Terms: personal, non-commercial use reviewed by the owner (2026-10-05); one request
# at a time, pace_s apart. Files live in `dir` (gitignored), one per kind of result.
source = "procyclingstats"
dir = "data/raw/road_cycling"
pace_s = 2.0
files = { itt = "itt_results_pcs.csv", road = "road_results_pcs.csv" }

[results.itt]
# Individual time trials: championships and national championships (one-day pages), and every ITT stage (stage
# name carries "ITT") of these stage races.
one_day = ["world-championship-itt", "uec-road-european-championships-itt",
           "nc-belgium-itt", "nc-denmark-itt", "nc-france-itt", "nc-great-britain-itt", "nc-switzerland-itt",
           "nc-spain-itt", "nc-italy-itt", "nc-slovenia-itt", "nc-netherlands-itt", "nc-czech-republic-itt",
           "nc-portugal-itt", "nc-sweden-itt", "nc-hungary-itt", "nc-luxembourg-itt"]
stage_races = ["giro-d-italia", "tour-de-france", "vuelta-a-espana", "paris-nice", "tirreno-adriatico",
               "tour-de-romandie", "dauphine", "tour-de-suisse", "renewi-tour", "tour-of-britain"]

[results.road]
# Mass-start results: hilly and mixed one-day races (WorldTour and the strong .Pro / .1 races, the Italian autumn
# block in full), the championships, and the final GC of the main stage races (climbers race few one-day races).
one_day = ["world-championship", "uec-road-european-championships",
           "milano-sanremo", "strade-bianche", "omloop-het-nieuwsblad", "e3-harelbeke", "gent-wevelgem",
           "dwars-door-vlaanderen", "ronde-van-vlaanderen", "amstel-gold-race", "la-fleche-wallonne",
           "liege-bastogne-liege", "eschborn-frankfurt", "san-sebastian", "bretagne-classic", "gp-quebec",
           "gp-montreal", "il-lombardia", "cadel-evans-great-ocean-road-race",
           "trofeo-laigueglia", "faun-drome-classic", "faun-ardeche-classic", "gp-miguel-indurain",
           "brabantse-pijl", "gp-de-wallonie", "giro-della-toscana", "coppa-sabatini", "memorial-marco-pantani",
           "giro-dell-emilia", "coppa-bernocchi", "tre-valli-varesine", "coppa-agostoni", "gran-piemonte",
           "giro-del-veneto", "veneto-classic", "milano-torino", "gp-industria-artigianato-larciano",
           "trofeo-matteotti", "gp-de-plumelec", "tour-du-finistere", "boucles-de-l-aulne", "japan-cup",
           "clasica-jaen-paraiso-interior", "circuito-de-getxo", "gp-de-fourmies"]
stage_race_gc = ["tour-down-under", "uae-tour", "paris-nice", "tirreno-adriatico", "volta-a-catalunya",
                 "itzulia-basque-country", "tour-of-the-alps", "tour-de-romandie", "dauphine", "tour-de-suisse",
                 "giro-d-italia", "tour-de-france", "vuelta-a-espana", "tour-de-pologne", "deutschland-tour",
                 "volta-ao-algarve", "o-gran-camino", "tour-of-oman", "settimana-coppi-bartali",
                 "tour-de-l-ain", "vuelta-a-burgos", "arctic-race-of-norway", "tour-de-luxembourg",
                 "giro-di-sicilia", "tour-of-austria"]

[model.itt]
# Calibrated walk-forward on 73 strong-field ITTs 2021-26 (2026-10-05, decision log in docs/road-cycling.md).
[model.itt.defaults]
half_life = 365.0
flat_weight = 1.0
weak_weight = 0.4
noise_scale = 1.15
incident_scale = 1.0
climb_scale = 0.5
climb_prior = 2.0

[model.itt.grid]
half_life = [240.0, 365.0, 730.0]
flat_weight = [0.5, 1.0]
weak_weight = [0.15, 0.4, 1.0]
noise_scale = [0.75, 0.9, 1.0, 1.15, 1.3]
incident_scale = [0.3, 1.0]
climb_scale = [0.0, 0.5, 1.0]
climb_prior = [2.0, 5.0]

[model.itt.rules]
hilly_m_per_km = 8.0                  # an ITT with 8+ m/km of climbing is hilly
weak_label = "national|/nc-"          # national championships are weak fields
weak_field = 40                       # so is any field under 40 finishers

[model.itt.backtest]
min_field = 30
categories = ["ME", "MF"]             # strong fields, any course

[model.road]
# First version 2026-10-05 for Tre Valli Varesine; defaults are a guess until `--calibrate` has run.
[model.road.defaults]
half_life = 365.0
flat_weight = 0.5
weak_weight = 1.0
gc_weight = 0.5
noise_scale = 1.0
incident_scale = 1.0

[model.road.grid]
half_life = [365.0, 730.0]
flat_weight = [0.3, 1.0]
weak_weight = [0.5, 1.0]
gc_weight = [0.0, 0.5]
noise_scale = [0.8, 1.0, 1.25, 1.5]
incident_scale = [0.5, 1.0]

[model.road.rules]
hilly_icons = ["p3", "p4", "p5"]      # PCS profile: p1 flat, p2 hills + flat finish, p3+ hilly / mountains
hilly_score = 120                     # ProfileScore fallback when the icon is missing
strong_classes = ["1.UWT", "WC", "CC", "OG"]   # WorldTour one-day races and championships; the rest are weak
weak_field = 60

[model.road.backtest]
min_field = 60
categories = ["ME", "WH"]             # hilly one-day races, any field strength
