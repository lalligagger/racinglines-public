# 24 Hours of Le Mans: a tape-only sport (docs/todo.md, U9). No model, no pipeline: its Kalshi markets are synced and
# recorded (links unmodeled, prices / trades / books archived per exchange) when asked for by name
# (`racinglines markets --exchange kalshi --sport le_mans ...`). Read by racinglines/sports.py; the sync reads
# [markets.kalshi]. Nothing runs for this sport by default.

[sport]
code = "le_mans"
name = "24 Hours of Le Mans"
result_kind = "position"          # finishing positions, once there is a model
model_family = "none"             # tapes only: no model, no pricing_model, no live adapter
display_order = 7

[league]
code = "aco_wec"
name = "FIA World Endurance Championship"
organizer = "ACO / FIA"

[competition]
code = "le_mans_24h"
name = "24 Hours of Le Mans (Overall)"
display_name = "Le Mans"
categories = { CAR = ["Cars", "X", "elite"] }

[markets]
venues = ["kalshi"]
standard_kinds = []               # nothing is priced, so the board has no columns for it

[markets.kalshi]
# Kalshi series tickers to sync, by prefix: every Sports series whose ticker starts with one of these
# (`sync --series TICKER ...` overrides the list). Off by default: only `--sport le_mans` syncs them.
series = ["KXLEMANS24H"]

[results]
# Results source: Wikipedia (CC-BY-SA 3.0, approved 2026-10-01). Le Mans race results and podiums are published
# on Wikipedia for every running of the 24 Hours since the race's founding (1923). Races are recorded as tape-only
# (unmodeled); a model is 2027 roadmap (docs/coverage.md).
fallback_rule = "wikipedia_only"
fallbacks = [{ source = "wikipedia", quality = "full_results", scope = "race_summary",
              allow = true, notes = "CC-BY-SA 3.0; full race results, podiums, class winners available" }]
