# MotoGP: result-only model track, not a lap-split model. The public JSON exposes a classification table for
# each finished session (practice, qualifying, warm-up, sprint, race), but not per-lap/sector timing data,
# so the first pricing pass stays conservative and uses rider form from session and race results only.
# Kalshi and Polymarket market syncs remain available as archive-only readers.

[sport]
code = "motogp"
name = "MotoGP"
result_kind = "position"          # finishing positions
model_family = "position_sim"     # conservative, result-only pricing model
# The sport-agnostic results model (models/model_global.py: start list, retirements, team groups), with [model] below.
# PROPOSED, staging only, owner to confirm: docs/f1-roadmap.md decision log 2026-10-07 "GlobalModel for NASCAR and
# MotoGP". Its settings are the model's a priori defaults (no [model.defaults]), none tuned.
pricing_model = "racinglines.models.model_global:GlobalModel"
# Other pricing models kept runnable (`racinglines backtest walk-forward motogp --model NAME`), by model_runs.model name
challengers = { motogp_results = "racinglines.models.motogp_model:MotoGPRace", motogp_recent_form = "racinglines.models.motogp_model:MotoGPRaceChallenger" }
display_order = 2
results_modules = ["racinglines.sources.motogp"]   # what fetches its results (`backtest coverage`)

[league]
code = "fim_motogp"
name = "FIM MotoGP World Championship"
organizer = "FIM / Dorna Sports"

[competition]
code = "motogp_wc"
name = "MotoGP World Championship (Riders)"
display_name = "MotoGP"
categories = { RDR = ["Riders", "X", "elite"] }

[markets]
venues = ["polymarket", "kalshi"]
standard_kinds = ["race_win"]     # the board's column (on by default, owner 2026-09-30): priced by the replay's saved runs
# The kinds a link is filed as (market_links.prediction) once the [identity] resolver has its kind, rider and race: the
# Grand Prix winner; the champion and teams' champion keep params.kind (or none) and stay unmodeled
kinds = ["race_win"]

[markets.kalshi]
# Kalshi series tickers to sync, by prefix: every Sports series whose ticker starts with one of these
# (`sync --series TICKER ...` overrides the list). Off by default: only `--sport motogp` syncs them.
series = ["KXMOTOGP"]

[identity]
# Which rider, race and contract a market is about, whichever exchange listed it (racinglines/sources/motogp/links.py).
# On by default since 2026-09-30 (owner): the syncs fill athlete_id, race_id and params.kind; `prediction` stays unmodeled.
resolver = "motogp"

[markets.polymarket]
# Gamma /events tag_slug values to page (`sync --tags SLUG ...` overrides the list). Off by default: only `--sport motogp` syncs them.
# UNVERIFIED against the live Gamma API (cloud session can't reach Polymarket); confirmed listed 2026-09-29 by the
# owner's public-search probe (docs/coverage.md); `sync --tags SLUG ...` overrides.
tags = ["motogp"]

# Results source, probed read-only from the owner's Mac 2026-09-29 (tests/fixtures/market/motogp_README.txt).
# The adapter exists in `racinglines/sources/motogp/` and ingests every finished session classification it can
# fetch, but it still does not fabricate lap-by-lap or sector-level data where the public host returns 400s.
[results]
classified = "status_ok"          # settlement: only a classified finish (INSTND) counts (markets/payoffs.py classified)
host = "https://api.motogp.pulselive.com/motogp/v1"   # public, no key, no auth; unofficial (see `terms` below)
# seasons, categories, events, sessions, session/{id}/classification, standings: all confirmed 200 with real JSON,
# 2026-09-29. History: 78 seasons, 1949-2026. Every finished session exposes a classification table with position,
# gap, total time, points and status per rider, but not lap-by-lap or sector splits. Confirmed (own probe +
# fabricepipart/mgp-timings, an open-source wrapper of this same API): sector/lap analysis is PDF-only
# (`session_files.analysis` etc., linked per session), not exposed as JSON anywhere on this host. Guessed lap/sector
# JSON paths (laps, analysis, sectors, splits, ...) all returned 400, not 200.
terms = """restrictive: motogp.com's Terms & Conditions (checked 2026-09-29) limit 'Our Channels' to personal, \
non-commercial use and forbid copying, exchanging or transmitting Content 'for any purpose whatsoever, \
whether for profit or free of charge' (item 3). No separate API terms were found; this API backs the \
same site. Owner reviewed 2026-09-29 and said the intended use (a private, non-commercial fantasy-trading \
app for friends) can proceed for now, to be reviewed again in more detail before any soft launch."""
limits = { history_seasons = 78, splits_available = false }   # splits_available: no per-lap/sector data in JSON

[model]
# Data hooks for the sport-agnostic results model (racinglines/models/model_global.py, `--model global`); the
# history's events.source is the [replay] source below. No setting here is tuned.
group = "team"                    # results.team, for the optional team-form prior
# The qualifying order (round "qual": Q2 then the Q1 riders who didn't reach it, racinglines/sources/motogp/ingest.py)
# drawn from past qualifying results, for race_pole (models/model_global.py; decision log 2026-10-07 "NASCAR pole and
# fastest lap", provisional). Inert until qualifying is in the database: the VM backfill (C12b report) brings it
sessions = ["qual"]

[replay]
# The taker replay (racinglines/pipelines/position_replay.py; `racinglines motogp replay`). Links stored before the
# [identity] resolver was turned on are identified in memory (racinglines/sources/motogp/links.py); the replay writes
# nothing to market_links. A priori values, none tuned:
# docs/f1-roadmap.md decision log, 2026-09-30 "NASCAR / MotoGP taker replay".
source = "motogp_api"
linker = "motogp"
kinds = ["race_win"]              # the one race contract the listings show (KXMOTOGPRACE: 289 of 322 Kalshi markets)
race_day_offset = 2               # an event is filed by its first day (Friday); the Grand Prix is on Sunday
# (label, hours from 00:00 UTC on race day): "race eve" is 18:00 UTC on Saturday, after the sprint
stages = [["T-3d", -72], ["T-1d", -24], ["race eve", -6]]
group_target = { race_win = 1 }

[sweep]
# The season sweep (racinglines/pipelines/season_sweep.py; `racinglines motogp sweep`, search jobs of kind "sweep"): the
# F1 sweep's taker modes and maker variants on the [replay] stages, kinds and group targets, priced by [sport]
# pricing_model from results strictly before the event, settled by classified position. Venues: [markets] venues,
# plus OG.com where exchanges/og.toml lists the sport. A priori values, none tuned.
stages = "weekend"                # the stage mode: the fixed [replay] stages, one pricing per race (the replay's
                                  # behaviour, kept reproducible; a session-aware mode needs [sessions.schedule])
late_stages = ["race eve"]        # the stage-aware taker ("early") skips these
quote_until_hours = 0             # the maker stops quoting at this hour (UTC) of race day: before any race-day running
                                  # (the race's start time isn't in the schema)

[search]
# The search queue's job kinds for this sport (racinglines/pipelines/search.py); the first is the default.
jobs = ["walk_forward", "sweep"]
