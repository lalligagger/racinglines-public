code = "race_win"
label = "Race winner"
subject = "driver"
status = "exists"
settle_from = "classification"
venues = { book_a = "Race Winner", book_c = "Odds to win F1 - Singapore GP 2026", book_b = "Odds to Win Singapore Grand Prix", kalshi = "KXF1RACE", polymarket = "<GP>: Driver Winner", og = "Race Winner" }

