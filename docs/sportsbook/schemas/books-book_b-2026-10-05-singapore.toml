# DRAFT (2026-10-06, roadmap example #2): the same book schema for an American-odds sportsbook. Transcribed from the
# owner's sportsbook B screenshot (2026-10-05 22:59 PDT),
# 22 prices, all 22 drivers of the board. Pricing itself belongs to the "track sportsbook bets" thread; this file only
# shows the schema carrying a second venue and a second odds format with no change to the event file.

[book]
venue = "book_b"                       # venues/book_b.toml (not drafted; its one rule would be "^odds to win" -> race_win)
event = "2026-17"                         # events/f1/2026-17-singapore.toml, unchanged
captured_utc = "2026-10-06T05:59Z"        # screenshot file time 2026-10-05 22:59 PDT
source = "screenshot"
source_ref = "owner screenshot (outside the repo)"
odds = "american"
currency = "USD"                          # assumed from the venue; not shown on the screenshot (inferred)
title_time = "Fri, 1:30 AM"               # as printed; the venue's local zone is unknown

[[lines]]
title = "Odds to Win Singapore Grand Prix"
selection = "Max Verstappen"
odds = +250
market = { kind = "race_win", driver = "Max Verstappen" }

