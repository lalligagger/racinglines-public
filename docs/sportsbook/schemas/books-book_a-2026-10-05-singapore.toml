# DRAFT (2026-10-06, roadmap example): one venue's lines for one event, as captured. Proposed location:
# books/book_a/2026-10-05-2026-17-singapore.toml. Values below are real, copied from
# the owner's priced board (outside the repo) (13 of its 368 rows), notes included.
# Nothing reads this file yet.

[book]
venue = "book_a"                       # venues/book_a.toml holds the title rules and odds format
event = "2026-17"                         # events/f1/2026-17-singapore.toml
captured_utc = "2026-10-06T05:33Z"        # screenshot 2026-10-05 22:33 PDT
source = "screenshot"                     # screenshot | paste | api
source_ref = "owner screenshot (outside the repo)"
odds = "decimal"
currency = "USDT"

# One line per price. `title` and `selection` are the venue's own words, untouched. `market` is the event market key
# (kind, subject, params) the venue rules produced, written here so the mapping is reviewable; a line the rules do not
# match stays `market = "unmapped"` and is never guessed.
[[lines]]
title = "Race Winner"
selection = "Verstappen, Max"
odds = 3.50
market = { kind = "race_win", driver = "Max Verstappen" }

